<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #11111b;
      --card-bg: #1e1e2e;
      --card-border: #313244;
      --text-primary: #cdd6f4;
      --text-secondary: #a6adc8;
      --accent: #89b4fa;
      --success: #a6e3a1;
      --danger: #f38ba8;
      --purple: #cba6f7;
      --blue: #89b4fa;
    }
    body {
      width: 320px;
      padding: 14px;
      margin: 0;
      background: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
    }
    .title {
      font-size: 15px;
      font-weight: bold;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      cursor: pointer;
      padding: 3px 0;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .item-row:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .item-name {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .badge {
      font-size: 11px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 12px;
    }
    .badge.online { background: rgba(166, 227, 161, 0.15); color: var(--success); }
    .badge.offline { background: rgba(243, 139, 168, 0.15); color: var(--danger); }
    .toggle-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .toggle-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toggle-hint {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 6px;
      line-height: 1.3;
    }
    /* Switch component */
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #313244;
      transition: .2s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: #cdd6f4;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--purple);
    }
    input:checked + .slider:before {
      transform: translateX(18px);
      background-color: #11111b;
    }
    button {
      width: 100%;
      padding: 10px;
      background: var(--purple);
      color: #11111b;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s, background 0.2s;
    }
    button:active { opacity: 0.8; }
    .toast {
      margin-top: 8px;
      font-size: 12px;
      text-align: center;
      color: var(--success);
      display: none;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🤖 StreamBot Token 同步器</div>
    <span class="badge online">v1.3.0</span>
  </div>

  <div class="status-card">
    <div class="item-row" id="rowServer">
      <span class="item-name">🖥️ StreamBot 本機 (18730)</span>
      <span id="serverStatus" class="badge offline">檢測中...</span>
    </div>
    <div class="item-row" id="rowRplay" title="點擊切換/開啟 Rplay 頁面">
      <span class="item-name">🎵 Rplay Token 狀態 ↗</span>
      <span id="rplayStatus" class="badge offline">未偵測到</span>
    </div>
    <div class="item-row" id="rowWithny" title="點擊切換/開啟 Withny 頁面">
      <span class="item-name">🪐 Withny Token 狀態 ↗</span>
      <span id="withnyStatus" class="badge offline">未偵測到</span>
    </div>
  </div>

  <div class="toggle-card">
    <div class="toggle-row">
      <span class="toggle-label">🔄 Rplay 5分鐘自動刷新</span>
      <label class="switch">
        <input type="checkbox" id="toggleAutoReload">
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-hint">開啟後每 5 分鐘自動刷新已開啟的 Rplay 頁面，隨時保持最新登入 Token。</div>
  </div>

  <button id="btnSync">⚡ 更新並自動轉到 Rplay 頁面</button>
  <div id="toastMsg" class="toast">✅ 已自動轉到 Rplay 頁面並同步 Token！</div>

  <script src="popup.js"></script>
</body>
</html>
